<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GlowReadTTS - Terms of Use & Privacy Policy</title>
  <link rel="stylesheet" href="eula.css">
</head>
<body>
  <div class="eula-container">
    <div class="eula-header">
      <h1>GlowReadTTS</h1>
    </div>

    <p class="eula-lede">
      GlowReadTTS runs entirely on your device. No account, no network requests,
      nothing leaves your computer. Free and open source under the GNU GPL v3.
    </p>

    <p class="eula-assent">
      By clicking Accept &amp; Continue you agree to the
      <a href="#terms-details" id="link-terms">Terms of Use</a> and
      <a href="#privacy-details" id="link-privacy">Privacy Policy</a>.
    </p>

    <div class="eula-actions">
      <div class="eula-buttons">
        <button id="btn-decline" class="eula-btn eula-btn-decline">Decline</button>
        <button id="btn-accept" class="eula-btn eula-btn-accept">Accept &amp; Continue</button>
      </div>
    </div>

    <details class="eula-details" id="terms-details">
      <summary>Terms of Use (End User License Agreement)</summary>
      <div class="eula-text" id="eula-text"></div>
    </details>

    <details class="eula-details" id="privacy-details">
      <summary>Privacy Policy</summary>
      <div class="eula-text" id="privacy-text"></div>
    </details>
  </div>
  <script src="eula.js"></script>
</body>
</html>
