<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GlowReadTTS - Terms of Use & Privacy Policy</title>
  <link rel="stylesheet" href="eula.css">
</head>
<body>
  <div class="eula-container">
    <div class="eula-header">
      <h1>GlowReadTTS</h1>
      <p>Please review and accept our Terms of Use and Privacy Policy to continue.</p>
    </div>

    <div class="eula-content" id="eula-content">
      <h2>Terms of Use (End User License Agreement)</h2>
      <div id="eula-text"></div>

      <h2>Privacy Policy</h2>
      <div id="privacy-text"></div>
    </div>

    <div class="eula-scroll-notice" id="scroll-notice">
      Scroll down to read the full agreement
    </div>

    <div class="eula-actions">
      <label class="eula-checkbox-label">
        <input type="checkbox" id="eula-checkbox" disabled>
        <span>I have read and agree to the Terms of Use and Privacy Policy</span>
      </label>
      <div class="eula-buttons">
        <button id="btn-decline" class="eula-btn eula-btn-decline">Decline</button>
        <button id="btn-accept" class="eula-btn eula-btn-accept" disabled>Accept &amp; Continue</button>
      </div>
    </div>
  </div>
  <script src="eula.js"></script>
</body>
</html>
